name: Deploy GitHub Pages

# Publica num único artefato:
#   main -> https://viniciusjrcarlos.github.io/humanity-tokens/          (oficial)
#   dev  -> https://viniciusjrcarlos.github.io/humanity-tokens/preview/  (prévia)
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, path: dev }
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dev/package-lock.json
            main/package-lock.json
      - name: Instalar e testar (dev)
        working-directory: dev
        run: npm ci && npm test
      - name: Instalar (main)
        working-directory: main
        run: npm ci
      - name: Montar site (oficial + prévia)
        run: bash dev/scripts/build-pages.sh main dev site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
